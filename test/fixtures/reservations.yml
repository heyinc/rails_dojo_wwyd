<% future_date = Date.current + 1.day %>

one:
  email: reservation1@example.com
  name: Reservation One
  date: <%= future_date %>
  time: <%= Time.current.change(hour: 14, min: 0) %>
  preferred_staff:
  purchase_intention: false
  status: pending

two:
  email: reservation2@example.com
  name: Reservation Two
  date: <%= future_date + 1.day %>
  time: <%= Time.current.change(hour: 15, min: 0) %>
  preferred_staff:
  purchase_intention: true
  status: pending

completed:
  email: reservation+completed@example.com
  name: Reservation Completed
  date: <%= future_date + 2.day %>
  time: <%= Time.current.change(hour: 12, min: 0) %>
  preferred_staff:
  purchase_intention: true
  status: completed
